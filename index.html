<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المراجع الذكية - تجمع الأحساء الصحي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: white; font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; }
        
        .main-card { background: #151c2c; border: 2px solid #2a344d; border-radius: 20px; padding: 25px; text-align: center; max-width: 550px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.6); margin-top: auto; margin-bottom: auto; }
        .cluster-logo { height: 80px; width: auto; object-fit: contain; margin-bottom: 15px; }
        
        .info-box { background: #111827; border: 1px solid #1f2937; border-radius: 15px; padding: 15px; margin-top: 12px; text-align: right; }
        .info-item { margin-bottom: 14px; font-size: 0.95rem; display: flex; flex-direction: column; gap: 4px; }
        .info-item:last-child { margin-bottom: 0; }
        .info-label { color: #38bdf8; font-weight: bold; }
        .info-value { color: #f3f4f6; }

        .btn-custom { font-size: 0.95rem; padding: 10px 12px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 12px; transition: 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; border: none; }
        
        .btn-sehati { background-color: #0d9488; color: white; }
        .btn-sehati:hover { background-color: #0f766e; color: white; }

        #selectionScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 500px; margin: auto; text-align: center; padding: 20px; }
        .form-select { background-color: #111827 !important; color: white !important; border: 1px solid #374151 !important; padding: 10px; border-radius: 8px; font-size: 0.95rem; }
        .form-select option { background-color: #151c2c; color: white; }
    </style>
</head>

    <!-- شاشة اختيار المركز الصحي -->
    <div id="selectionScreen" class="main-card">

        <h4 class="text-warning fw-bold mb-2">بوابة الخدمات الصحية</h4>
        <p class="text-muted small mb-3">تجمع الأحساء الصحي - يرجى تحديد مركزك الصحي للمتابعة</p>
        
        <div class="card bg-dark border-secondary p-3 text-right rounded-3 mb-2 w-100 shadow-sm">
            <label class="form-label text-info small fw-bold mb-2">🏥 اختر مركزك الصحي من القائمة:</label>
            <select id="manualCenterSelect" class="form-select w-100 mb-3">
                <option value="">-- اضغط هنا لاختيار المركز --</option>
            </select>
            <button class="btn btn-warning w-100 fw-bold text-dark py-2 shadow" style="font-size: 0.95rem;" onclick="selectCenterManually()">
                تأكيد والدخول للنظام ➔
            </button>
        </div>
    </div>

    <!-- واجهة البيانات المرئية بعد الاختيار -->
    <div class="main-card" id="appContent" style="display: none;">
        <img src="https://github.com/blu2ris-create/clinic-queue-system/blob/main/logo.png%20(2).png?raw=true" alt="شعار التجمع الصحي" class="cluster-logo">
        
        <h4 id="clinicNameTitle" class="text-warning fw-bold mb-1">--</h4>
        <p class="text-muted small mb-2">تجمع الأحساء الصحي - الرعاية الصحية الأولية</p>

        <!-- صندوق تغيير المركز -->

            <select id="changeCenterSelect" class="form-select w-100 mb-2">
                <option value="">-- اختر مركزاً آخر --</option>
            </select>
            <button class="btn btn-warning w-100 fw-bold text-dark py-1.5 shadow-sm" style="font-size: 0.9rem;" onclick="changeCenterManually()">
                تحديث واختيار المركز الجديد
            </button>
        </div>

        <div class="info-box">
            <div class="info-item">
                <span class="info-label">🕒 أوقات العمل:</span>
                <span id="clinicHours" class="info-value">--</span>
            </div>
            <div class="info-item">

            </div>
        </div>

        let currentActiveCenter = null;

        window.addEventListener('DOMContentLoaded', () => {
            const selectDropdown = document.getElementById('manualCenterSelect');
            const changeDropdown = document.getElementById('changeCenterSelect');
            
            healthCenters.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            
            healthCenters.forEach((center, index) => {
                let opt1 = document.createElement('option');
                opt1.value = index;
                opt1.textContent = center.name;
                selectDropdown.appendChild(opt1);

                let opt2 = document.createElement('option');
                opt2.value = index;
                opt2.textContent = center.name;
                changeDropdown.appendChild(opt2);
            });

            const savedCenterIdx = localStorage.getItem('selected_health_center_idx');
            if (savedCenterIdx !== null && healthCenters[savedCenterIdx]) {
                displayCenterInfo(healthCenters[savedCenterIdx]);
            } else {
                document.getElementById('selectionScreen').style.display = 'block';
                document.getElementById('appContent').style.display = 'none';
            }
        });

        function selectCenterManually() {
            const selectDropdown = document.getElementById('manualCenterSelect');
            const selectedIndex = selectDropdown.value;
            
            if (selectedIndex === "") {
                alert("⚠️ الرجاء اختيار المركز الصحي من القائمة أولاً.");
                return;
            }
            
            localStorage.setItem('selected_health_center_idx', selectedIndex);
            displayCenterInfo(healthCenters[selectedIndex]);
        }

        function changeCenterManually() {
            const changeDropdown = document.getElementById('changeCenterSelect');
            const selectedIndex = changeDropdown.value;
            
            if (selectedIndex === "") {
                alert("⚠️ الرجاء اختيار مركز آخر من القائمة للتحديث.");
                return;
            }
            
            localStorage.setItem('selected_health_center_idx', selectedIndex);
            displayCenterInfo(healthCenters[selectedIndex]);
        }

        function displayCenterInfo(center) {
            currentActiveCenter = center;
            currentActiveCenter.mapsUrl = `https://maps.google.com/?q=${center.lat},${center.lng}`;
            
            document.getElementById('clinicNameTitle').innerText = center.name;
            document.getElementById('clinicHours').innerText = center.hours;
            document.getElementById('clinicDental').innerText = center.dental;

            const centerIndex = healthCenters.findIndex(c => c.name === center.name);
            if(centerIndex !== -1) {
                document.getElementById('changeCenterSelect').value = centerIndex;
            }

            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
        }

        function openSehhatyApp() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            const iosAppStoreUrl = "https://apps.apple.com/sa/app/%D8%B5%D8%AD%D8%AA%D9%8A-sehhaty/id1459266578";
            const androidPlayStoreUrl = "https://play.google.com/store/apps/details?id=com.lean.sehhaty";
            const webFallbackUrl = "https://sehaty.sa";

            if (/android/i.test(userAgent)) {
                window.location.href = "intent://sehhaty.sa/#Intent;scheme=https;package=com.lean.sehhaty;end;";
                setTimeout(() => {
                    window.location.href = androidPlayStoreUrl;
                }, 500);
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = iosAppStoreUrl;
            } else {
                window.open(webFallbackUrl, '_blank');
            }
        }

        function openGoogleMaps() {
            if (currentActiveCenter && currentActiveCenter.mapsUrl) {
                window.location.href = currentActiveCenter.mapsUrl;
            }
        }
    </script>
