        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: white; font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; }
        
        .main-card { background: #151c2c; border: 2px solid #2a344d; border-radius: 20px; padding: 30px; text-align: center; max-width: 550px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.6); margin-top: auto; margin-bottom: auto; }
        .cluster-logo { height: 90px; width: auto; object-fit: contain; margin-bottom: 20px; }
        
        .info-box { background: #111827; border: 1px solid #1f2937; border-radius: 15px; padding: 20px; margin-top: 15px; text-align: right; }
        .info-item { margin-bottom: 12px; font-size: 1.05rem; }
        .info-label { color: #38bdf8; font-weight: bold; }
        .info-value { color: #f3f4f6; }

        .btn-custom { font-size: 1.1rem; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; margin-top: 15px; transition: 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border: none; }
        
        .btn-sehati { background-color: #0d9488; color: white; }
        .btn-sehati:hover { background-color: #0f766e; color: white; }

        .store-btns-container { display: flex; gap: 8px; margin-top: 10px; }
        .store-btn { flex: 1; font-size: 0.85rem; padding: 8px 5px; border-radius: 8px; font-weight: bold; text-decoration: none; text-align: center; color: white; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .store-apple { background-color: #111827; }
        .store-apple:hover { background-color: #1f2937; color: #38bdf8; }
        .store-google { background-color: #111827; }
        .store-google:hover { background-color: #1f2937; color: #34d399; }
        .store-huawei { background-color: #111827; }
        .store-huawei:hover { background-color: #1f2937; color: #fbbf24; }

        #selectionScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 500px; margin: auto; text-align: center; padding: 20px; }
        .form-select { background-color: #111827 !important; color: white !important; border: 1px solid #374151 !important; padding: 12px; border-radius: 10px; font-size: 1rem; }

        let currentActiveCenter = null;

        window.addEventListener('DOMContentLoaded', () => {
            const selectDropdown = document.getElementById('manualCenterSelect');
            const changeDropdown = document.getElementById('changeCenterSelect');
            
            healthCenters.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            
            healthCenters.forEach((center, index) => {
                let opt1 = document.createElement('option');
                opt1.value = index;
                opt1.textContent = center.name;
                selectDropdown.appendChild(opt1);

                let opt2 = document.createElement('option');
                opt2.value = index;
                opt2.textContent = center.name;
                changeDropdown.appendChild(opt2);
            });

            const savedCenterIdx = localStorage.getItem('selected_health_center_idx');
            if (savedCenterIdx !== null && healthCenters[savedCenterIdx]) {
                displayCenterInfo(healthCenters[savedCenterIdx]);
            } else {
                document.getElementById('selectionScreen').style.display = 'block';
                document.getElementById('appContent').style.display = 'none';
            }
        });

        function selectCenterManually() {
            const selectDropdown = document.getElementById('manualCenterSelect');
            const selectedIndex = selectDropdown.value;
            
            if (selectedIndex === "") {
                alert("⚠️ الرجاء اختيار المركز الصحي من القائمة أولاً.");
                return;
            }
            
            localStorage.setItem('selected_health_center_idx', selectedIndex);
            displayCenterInfo(healthCenters[selectedIndex]);
        }

        function changeCenterManually() {
            const changeDropdown = document.getElementById('changeCenterSelect');
            const selectedIndex = changeDropdown.value;
            
            if (selectedIndex === "") {
                alert("⚠️ الرجاء اختيار مركز آخر من القائمة للتحديث.");
                return;
            }
            
            localStorage.setItem('selected_health_center_idx', selectedIndex);
            displayCenterInfo(healthCenters[selectedIndex]);
        }

        function displayCenterInfo(center) {
            currentActiveCenter = center;
            currentActiveCenter.mapsUrl = `https://maps.google.com/?q=${center.lat},${center.lng}`;
            
            document.getElementById('clinicNameTitle').innerText = center.name;
            document.getElementById('clinicHours').innerText = center.hours;

            const centerIndex = healthCenters.findIndex(c => c.name === center.name);
            if(centerIndex !== -1) {
                document.getElementById('changeCenterSelect').value = centerIndex;
            }

            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
        }

        function openGoogleMaps() {
            if (currentActiveCenter && currentActiveCenter.mapsUrl) {
                window.location.href = currentActiveCenter.mapsUrl;
            }
