        body { background-color: #0b0f19; color: white; font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; }
        
        .main-card { background: #151c2c; border: 2px solid #2a344d; border-radius: 20px; padding: 25px; text-align: center; max-width: 550px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.6); margin-top: auto; margin-bottom: auto; }
        .cluster-logo { height: 80px; width: auto; object-fit: contain; margin-bottom: 15px; }
        
        .info-box { background: #111827; border: 1px solid #1f2937; border-radius: 15px; padding: 18px; margin-top: 15px; text-align: right; }
        .info-item { margin-bottom: 10px; font-size: 1rem; }
        .info-label { color: #38bdf8; font-weight: bold; }
        .info-value { color: #f3f4f6; }

        .btn-custom { font-size: 1.05rem; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; margin-top: 12px; transition: 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border: none; }
        
        .btn-sehati { background-color: #0d9488; color: white; }
        .btn-sehati:hover { background-color: #0f766e; color: white; }

        .form-select { background-color: #111827 !important; color: white !important; border: 1px solid #374151 !important; padding: 10px; border-radius: 10px; font-size: 0.95rem; font-family: 'Cairo', sans-serif; }
        .form-select option { background-color: #151c2c; color: white; }

        #loadingScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; background: #0b0f19; z-index: 9999; text-align: center; padding: 20px; }
        .spinner-border { width: 3rem; height: 3rem; color: #ffc107; margin-bottom: 20px; }
    </style>
</head>

        let currentActiveCenter = null;

        window.addEventListener('DOMContentLoaded', () => {
            const selectDropdown = document.getElementById('manualCenterSelect');
            healthCenters.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            
            healthCenters.forEach((center, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${center.name} (${center.sector})`;
                selectDropdown.appendChild(opt);
            });

            // التحقق هل تم اختيار مركز سابقاً ومحفوظ في الجهاز
            const savedCenterIdx = localStorage.getItem('selected_health_center_idx');
            if (savedCenterIdx !== null && healthCenters[savedCenterIdx]) {
                displayCenterInfo(healthCenters[savedCenterIdx], savedCenterIdx);
            } else {
                // محاولة التحديد التلقائي بالـ GPS أولاً
                initLocationCheck();
            }
        });

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function initLocationCheck() {
            if (!navigator.geolocation) {
                // في حال عدم دعم الـ GPS، يتم اختيار أول مركز افتراضياً مع إظهار الصفحة
                selectDefaultFallback();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    let closestCenter = null;
                    let minDistance = Infinity;
                    let closestIdx = 0;

                    healthCenters.forEach((center, index) => {
                        let dist = calculateDistance(userLat, userLng, center.lat, center.lng);
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestCenter = center;
                            closestIdx = index;
                        }
                    });

                    // حفظ واختيار الأقرب تلقائياً
                    localStorage.setItem('selected_health_center_idx', closestIdx);
                    displayCenterInfo(closestCenter, closestIdx);
                },
                (error) => {
                    // في حال رفض إذن الموقع أو فشله، يتم اختيار أول مركز افتراضياً
                    selectDefaultFallback();
                },
                { timeout: 10000, enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        function selectDefaultFallback() {
            const defaultIdx = 0;
            localStorage.setItem('selected_health_center_idx', defaultIdx);
            displayCenterInfo(healthCenters[defaultIdx], defaultIdx);
        }

        function displayCenterInfo(center, index) {
            currentActiveCenter = center;
            currentActiveCenter.mapsUrl = `https://maps.google.com/?q=${center.lat},${center.lng}`;
            
            document.getElementById('clinicNameTitle').innerText = center.name;
            document.getElementById('clinicSector').innerText = center.sector;
            document.getElementById('clinicHours').innerText = center.hours;
            
            // ضبط القائمة المنسدلة لتشير للمركز الحالي
            document.getElementById('manualCenterSelect').value = index;

            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
        }

        // تغيير المركز يدوياً في أي وقت من القائمة داخل الصفحة
        function changeCenterManually() {
            const selectDropdown = document.getElementById('manualCenterSelect');
            const selectedIndex = selectDropdown.value;
            
            if (selectedIndex === "") {
                alert("الرجاء اختيار مركز صحي من القائمة أولاً.");
                return;
            }
            
            localStorage.setItem('selected_health_center_idx', selectedIndex);
            displayCenterInfo(healthCenters[selectedIndex], selectedIndex);
        }

        function openGoogleMaps() {
            if (currentActiveCenter && currentActiveCenter.mapsUrl) {
                window.location.href = currentActiveCenter.mapsUrl;
            }
        }
    </script>

</html>
